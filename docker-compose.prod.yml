include:
  - docker-compose.base.yml

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: production
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - dataset_volume:/app/dataset
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-spotterrouter.mahboob.engineer,localhost,127.0.0.1,backend,nginx}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://spotterrouter.mahboob.engineer}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_LLM_MODEL_NAME: ${FIREWORKS_LLM_MODEL_NAME:-accounts/fireworks/models/deepseek-v4p1-flash}
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:-}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_TILE_SUBDOMAINS: ${MAP_TILE_SUBDOMAINS:-}
      MAP_TILE_SIZE: ${MAP_TILE_SIZE:-}
      MAP_TILE_ZOOM_OFFSET: ${MAP_TILE_ZOOM_OFFSET:-}
      MAP_TILE_MAX_ZOOM: ${MAP_TILE_MAX_ZOOM:-}
      AUTO_LOAD_STATIONS: ${AUTO_LOAD_STATIONS:-True}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
    networks:
      - fuel_network
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: production
    command: /app/infra/scripts/start-celery.sh
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-spotterrouter.mahboob.engineer,localhost,127.0.0.1,backend,nginx}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_LLM_MODEL_NAME: ${FIREWORKS_LLM_MODEL_NAME:-accounts/fireworks/models/deepseek-v4p1-flash}
    networks:
      - fuel_network
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: infra/docker/nginx/Dockerfile
    expose:
      - "80"
    volumes:
      - static_volume:/app/staticfiles:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
    networks:
      - dokploy-network
      - fuel_network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

networks:
  dokploy-network:
    name: dokploy-network
    external: true
