info:
  _postman_id: c7a8d8e0-3f41-4e89-b7e1-88f219198642
  name: Fuel Router API
  description: Postman test suite for the Fuel Router API assessment. Includes health check, route optimization presets, trip
    retrieval, and error scenarios.
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json
variable:
- key: base_url
  value: http://localhost:8000
  type: string
- key: trip_id
  value: 6b151003-f1e0-4324-8d89-fd8781ae4766
  type: string
item:
- name: Health
  item:
  - name: Health Check
    request:
      method: GET
      header:
      - key: Accept
        value: application/json
      url:
        raw: '{{base_url}}/api/health/'
        host:
        - '{{base_url}}'
        path:
        - api
        - health
        - ''
      description: Verify system health and container connectivity.
    response: []
- name: Trips - Planning
  item:
  - name: Plan Trip - Chicago, IL to Dallas, TX
    event:
    - listen: test
      script:
        exec:
        - pm.test("Status code is 200", function () {
        - '    pm.response.to.have.status(200);'
        - '});'
        - var jsonData = pm.response.json();
        - if (jsonData.id) {
        - '    pm.collectionVariables.set("trip_id", jsonData.id);'
        - '}'
        type: text/javascript
    request:
      method: POST
      header:
      - key: Content-Type
        value: application/json
      - key: Accept
        value: application/json
      body:
        mode: raw
        raw: "{\n  \"start\": \"Chicago, IL\",\n  \"end\": \"Dallas, TX\"\n}"
      url:
        raw: '{{base_url}}/api/trips/'
        host:
        - '{{base_url}}'
        path:
        - api
        - trips
        - ''
      description: Computes optimal fuel stops and route geometry between Chicago, IL and Dallas, TX.
    response: []
  - name: Plan Trip - New York, NY to Los Angeles, CA
    request:
      method: POST
      header:
      - key: Content-Type
        value: application/json
      - key: Accept
        value: application/json
      body:
        mode: raw
        raw: "{\n  \"start\": \"New York, NY\",\n  \"end\": \"Los Angeles, CA\"\n}"
      url:
        raw: '{{base_url}}/api/trips/'
        host:
        - '{{base_url}}'
        path:
        - api
        - trips
        - ''
      description: Cross-country route optimization between New York and Los Angeles.
    response: []
  - name: Plan Trip - Seattle, WA to Miami, FL
    request:
      method: POST
      header:
      - key: Content-Type
        value: application/json
      - key: Accept
        value: application/json
      body:
        mode: raw
        raw: "{\n  \"start\": \"Seattle, WA\",\n  \"end\": \"Miami, FL\"\n}"
      url:
        raw: '{{base_url}}/api/trips/'
        host:
        - '{{base_url}}'
        path:
        - api
        - trips
        - ''
      description: Diagonal cross-country route optimization between Seattle and Miami.
    response: []
  - name: Plan Trip - Atlanta, GA to Chicago, IL
    request:
      method: POST
      header:
      - key: Content-Type
        value: application/json
      - key: Accept
        value: application/json
      body:
        mode: raw
        raw: "{\n  \"start\": \"Atlanta, GA\",\n  \"end\": \"Chicago, IL\"\n}"
      url:
        raw: '{{base_url}}/api/trips/'
        host:
        - '{{base_url}}'
        path:
        - api
        - trips
        - ''
      description: Regional interstate route optimization between Atlanta and Chicago.
    response: []
- name: Trips - History & Retrieval
  item:
  - name: List Recent Trips
    request:
      method: GET
      header:
      - key: Accept
        value: application/json
      url:
        raw: '{{base_url}}/api/trips/'
        host:
        - '{{base_url}}'
        path:
        - api
        - trips
        - ''
      description: Retrieve history of recently computed trip plans.
    response: []
  - name: Get Trip by ID
    request:
      method: GET
      header:
      - key: Accept
        value: application/json
      url:
        raw: '{{base_url}}/api/trips/{{trip_id}}/'
        host:
        - '{{base_url}}'
        path:
        - api
        - trips
        - '{{trip_id}}'
        - ''
      description: Retrieve full details, fuel stops, coordinates, and AI explanation for a trip.
    response: []
- name: Error Scenarios
  item:
  - name: Error - Missing Fields
    request:
      method: POST
      header:
      - key: Content-Type
        value: application/json
      - key: Accept
        value: application/json
      body:
        mode: raw
        raw: '{}'
      url:
        raw: '{{base_url}}/api/trips/'
        host:
        - '{{base_url}}'
        path:
        - api
        - trips
        - ''
      description: Verifies 400 invalid_request error when mandatory fields are omitted.
    response: []
  - name: Error - Unresolvable Location
    request:
      method: POST
      header:
      - key: Content-Type
        value: application/json
      - key: Accept
        value: application/json
      body:
        mode: raw
        raw: "{\n  \"start\": \"NonExistentCityXYZ999\",\n  \"end\": \"Dallas, TX\"\n}"
      url:
        raw: '{{base_url}}/api/trips/'
        host:
        - '{{base_url}}'
        path:
        - api
        - trips
        - ''
      description: Verifies 400 unresolvable_location error when location cannot be geocoded.
    response: []
  - name: Error - Non-Contiguous US Location
    request:
      method: POST
      header:
      - key: Content-Type
        value: application/json
      - key: Accept
        value: application/json
      body:
        mode: raw
        raw: "{\n  \"start\": \"Honolulu, HI\",\n  \"end\": \"Dallas, TX\"\n}"
      url:
        raw: '{{base_url}}/api/trips/'
        host:
        - '{{base_url}}'
        path:
        - api
        - trips
        - ''
      description: Verifies 400 out_of_scope_location error when origin/destination is outside the contiguous 48 US states.
    response: []
  - name: Error - Non-Existent Trip ID
    request:
      method: GET
      header:
      - key: Accept
        value: application/json
      url:
        raw: '{{base_url}}/api/trips/00000000-0000-0000-0000-000000000000/'
        host:
        - '{{base_url}}'
        path:
        - api
        - trips
        - 00000000-0000-0000-0000-000000000000
        - ''
      description: Verifies 404 not_found error when querying an unknown trip UUID.
    response: []
